<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} — QR Codes Plovdiv</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/{{id}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="/{{id}}" />
    <meta property="og:image" content="{{image}}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />

    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js" defer></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "{{title}}",
      "url": "/{{id}}",
      "description": "{{description}}",
      "mainEntity": {
        "@type": "CreativeWork",
        "headline": "{{title}}",
        "about": "QR code content for {{location}}"
      }
    }
    </script>
    
</head>

<body>
    <div class="page">
        <header>
            <h1>{{title}}</h1>
            <p class="subtitle">QR Code ID: {{id}}</p>
        </header>
<!-- Work in progress! -->
        <main>
            <section class="card">
                <p><strong>Description:</strong> {{description}}</p>
                <p><strong>Location:</strong> {{location}}</p>
                <p><strong>Status:</strong> {{status}}</p>
            </section>
            <section class="share">
                <p>Share this link: <a href="/{{id}}">/{{id}}</a></p>
            </section>
        </main>

        <footer>
            <small>Powered by MongoDB content</small>
        </footer>
    </div>

    <div id="qr-data" data-id="{{id}}" data-title="{{title}}" data-description="{{description}}"
        data-location="{{location}}" data-status="{{status}}"></div>
</body>

</html>
